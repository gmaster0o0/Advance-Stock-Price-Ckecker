version: '3.8'

services:
  postgres-dev:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:15-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    profiles:
      - test

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - postgres-dev
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres-dev:5432/stock_dev?schema=public"

volumes:
  postgres-dev-data: